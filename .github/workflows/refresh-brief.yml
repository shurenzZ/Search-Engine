name: 刷新热搜快照

on:
  schedule:
    # 每小时的 15 / 45 分跑，错开整点高峰以免调度被推迟
    - cron: '15,45 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'

permissions:
  contents: write

concurrency:
  group: brief-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取并生成快照
        run: node tools/build-brief.mjs

      - name: 源契约自检（只报告，不阻断提交）
        run: node tools/verify-sources.mjs --server --report-only
        continue-on-error: true

      - name: 提交快照
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "data/ 无变化，跳过提交"
          else
            git commit -m "data: 更新热搜快照 [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
